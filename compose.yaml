name: devhub

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/devhub:latest
    container_name: devhub
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${DEVHUB_PORT:-8787}:8787"
      - "127.0.0.1:${DEVHUB_REMOTE_VAULT_PORT:-8788}:8788"
    environment:
      HOME: /data
      TZ: ${TZ:-Asia/Shanghai}
      DEVHUB_BASE_PATH: ${DEVHUB_BASE_PATH:-/}
      DEVHUB_ALLOW_INSECURE_LOCAL: "1"
      DEVHUB_REQUIRE_HTTPS: ${DEVHUB_REQUIRE_HTTPS:-1}
    volumes:
      - devhub-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8787/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  devhub-data:
    name: devhub-data
